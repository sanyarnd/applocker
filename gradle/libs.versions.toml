[versions]
junit = "6.1.3"
mockito = "5.24.0"
instancio = "6.1.0"
assertj = "3.27.7"
jspecify = "1.0.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
palantir-java-format = "2.102.0"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
instancio-junit = { module = "org.instancio:instancio-junit", version.ref = "instancio" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.3" }
errorprone = { id = "net.ltgt.errorprone", version = "5.1.1" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
