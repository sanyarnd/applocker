name: Pages

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Build javadoc
        shell: bash
        run: |
          args=()
          if [ "${{ github.ref_type }}" = "tag" ]; then
            args+=("-Pversion=${{ github.ref_name }}")
          fi
          ./gradlew javadoc "${args[@]}" --stacktrace

      - name: Prepare site
        run: |
          cp -r build/docs/javadoc gh-pages/apidocs
          cp README.md CHANGELOG.md gh-pages/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: gh-pages
