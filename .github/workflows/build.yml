name: Build

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.test-java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        test-java: [ '17', '21', '25' ]
        include:
          - os: windows-latest
            test-java: '21'
          - os: macos-latest
            test-java: '21'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # the last one is the default JDK which runs Gradle and the compiler
          java-version: |
            ${{ matrix.test-java }}
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        shell: bash
        run: >
          ./gradlew build --stacktrace
          -PtestJavaVersion=${{ matrix.test-java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.test-java }}_X64,JAVA_HOME_${{ matrix.test-java }}_ARM64

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.test-java }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  publication:
    name: Verify publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish to local repository
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Check published artifacts
        run: |
          dir="$HOME/.m2/repository/io/github/sanyarnd/app-locker"
          ls -R "$dir"
          for suffix in .jar -sources.jar -javadoc.jar .pom .module; do
            ls "$dir"/*/app-locker-*"$suffix" > /dev/null
          done

  # single required status check for branch protection, independent of the matrix layout
  build:
    name: Build
    if: always()
    needs: [ test, publication ]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
