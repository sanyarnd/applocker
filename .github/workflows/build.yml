name: Build

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.test-java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        test-java: [ '17', '21', '25' ]
        include:
          - os: windows-latest
            test-java: '25'
          - os: macos-latest
            test-java: '25'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # the last one becomes JAVA_HOME
          java-version: |
            ${{ matrix.test-java }}
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: bash
        run: >
          ./gradlew build --stacktrace
          -PtestJavaVersion=${{ matrix.test-java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.test-java }}_X64

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.test-java }}
          path: build/reports/

  publication:
    name: Verify publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to local repository
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Check published artifacts
        run: ls ~/.m2/repository/io/github/sanyarnd/app-locker/*/app-locker-*{.jar,-sources.jar,-javadoc.jar,.pom,.module}

  # required by branch protection
  build:
    name: Build
    if: always()
    needs: [ test, publication ]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
